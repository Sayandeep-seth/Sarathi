# EXAMPLE ONLY - not referenced by kustomization.yaml. Do not commit real values.
# Create the real Secret from your secret manager (External Secrets Operator,
# Sealed Secrets, SOPS) or by hand:
#
#   kubectl -n sarathi create secret generic sarathi-secrets \
#     --from-literal=SARATHI_DATABASE_URL='postgres://USER:PASS@HOST:5432/sarathi?sslmode=verify-full' \
#     --from-literal=SARATHI_REDIS_PASSWORD='...' \
#     --from-literal=SARATHI_MONGO_URL='mongodb+srv://USER:PASS@HOST/?tls=true' \
#     --from-literal=SARATHI_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SARATHI_GATEWAY_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=SARATHI_OTP_WEBHOOK_TOKEN='...' \
#     --from-literal=SARATHI_AI_SERVICE_TOKEN="$(openssl rand -hex 32)"
#
# Rotating SARATHI_JWT_SECRET signs every user out and changes boarding codes of
# trips that have not started; do it in a quiet window.
apiVersion: v1
kind: Secret
metadata:
  name: sarathi-secrets
  namespace: sarathi
type: Opaque
stringData:
  SARATHI_DATABASE_URL: "<postgres url, sslmode=verify-full>"
  SARATHI_REDIS_PASSWORD: "<redis password>"
  SARATHI_MONGO_URL: "<mongodb url with tls>"
  SARATHI_JWT_SECRET: "<64 hex chars>"
  SARATHI_GATEWAY_TOKEN: "<64 hex chars>"
  SARATHI_OTP_WEBHOOK_TOKEN: "<sms provider token>"
  SARATHI_AI_SERVICE_TOKEN: "<64 hex chars>"
  # Only when using components/datastores:
  # POSTGRES_PASSWORD: "<password>"
  # MONGO_PASSWORD: "<password>"
