# Single-replica PostgreSQL, Redis and MongoDB for development and demo clusters.
# NOT highly available and NOT backed up: a lost volume is lost data. For production
# use managed services or an operator (CloudNativePG, MongoDB Community Operator)
# and point the URLs in sarathi-secrets at them instead of including this component.
apiVersion: v1
kind: Service
metadata:
  name: sarathi-postgres
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: sarathi-postgres }
  ports:
    - { name: pg, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sarathi-postgres
spec:
  serviceName: sarathi-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sarathi-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sarathi-postgres, app.kubernetes.io/part-of: sarathi }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: sarathi }
            - { name: POSTGRES_DB, value: sarathi }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sarathi-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, sarathi, -d, sarathi] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, sarathi, -d, sarathi] }
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: sarathi-redis
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: sarathi-redis }
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sarathi-redis
spec:
  serviceName: sarathi-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sarathi-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sarathi-redis, app.kubernetes.io/part-of: sarathi }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c]
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: sarathi-secrets, key: SARATHI_REDIS_PASSWORD } }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [sh, -c, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG'] }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: sarathi-mongo
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: sarathi-mongo }
  ports:
    - { name: mongo, port: 27017 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sarathi-mongo
spec:
  serviceName: sarathi-mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sarathi-mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sarathi-mongo, app.kubernetes.io/part-of: sarathi }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongo
          image: mongo:7
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: sarathi }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: sarathi-secrets, key: MONGO_PASSWORD } }
          ports:
            - { name: mongo, containerPort: 27017 }
          readinessProbe:
            exec: { command: [mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"] }
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
# Only the API may talk to the databases.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-datastores
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sarathi-postgres, sarathi-redis, sarathi-mongo]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: sarathi-api }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 27017, protocol: TCP }
