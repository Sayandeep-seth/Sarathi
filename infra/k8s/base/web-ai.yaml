apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarathi-web
  labels: { app.kubernetes.io/name: sarathi-web, app.kubernetes.io/part-of: sarathi }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: sarathi-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sarathi-web, app.kubernetes.io/part-of: sarathi }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: sarathi/web
          env:
            - { name: API_UPSTREAM, value: "sarathi-api:8080" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            # nginx renders its config and keeps temp files here; the root fs is read-only.
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: sarathi-web
  labels: { app.kubernetes.io/name: sarathi-web }
spec:
  selector: { app.kubernetes.io/name: sarathi-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sarathi-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sarathi-web }
---
# Advisory analytics service. Not on any request path today; kept internal-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarathi-ai
  labels: { app.kubernetes.io/name: sarathi-ai, app.kubernetes.io/part-of: sarathi }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sarathi-ai }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sarathi-ai, app.kubernetes.io/part-of: sarathi }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai
          image: sarathi/ai
          env:
            - name: SARATHI_AI_ENV
              valueFrom: { configMapKeyRef: { name: sarathi-config, key: SARATHI_ENV } }
            - name: SARATHI_AI_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: sarathi-secrets, key: SARATHI_AI_SERVICE_TOKEN } }
          ports:
            - { name: http, containerPort: 8090 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: sarathi-ai
  labels: { app.kubernetes.io/name: sarathi-ai }
spec:
  selector: { app.kubernetes.io/name: sarathi-ai }
  ports:
    - { name: http, port: 8090, targetPort: http }
