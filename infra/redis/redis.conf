
# ===============================
# SARATHI REDIS CONFIGURATION
# ===============================

bind 0.0.0.0
port 6379

# Docker container operation
protected-mode yes

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec

# Database
databases 16

# Logging
loglevel notice

# TCP settings
timeout 0
tcp-keepalive 300

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
