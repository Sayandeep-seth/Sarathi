# Settings to MERGE into infra/redis/redis.conf for the realtime layer.
# Requires Redis >= 6.2 (GETDEL, GEOSEARCH). Redis 7.x recommended.

# Trip locks, driver status and tickets must never be silently evicted.
# With noeviction Redis returns an error when full instead of deleting
# random keys -> you find out from alerts, not from double-booked drivers.
maxmemory 512mb
maxmemory-policy noeviction

# Pub/Sub output buffer per subscriber connection (our gateways).
# hard 64mb / soft 16mb for 60s: a gateway that falls this far behind is
# disconnected by Redis; go-redis reconnects and re-subscribes automatically.
client-output-buffer-limit pubsub 64mb 16mb 60

# Detect dead gateway connections.
tcp-keepalive 60
timeout 0

# Live data is rebuilt within seconds after a restart (GPS keeps flowing),
# so light persistence is enough. Keep AOF if you also store bookings here.
appendonly yes
appendfsync everysec

# Production: set a password (and use the same in REDIS_PASSWORD)
# requirepass change-me
