# Reverse proxy for wss://rt.sarathi.in -> gateway replicas.
# No sticky sessions needed: any replica can serve any user thanks to Redis.

upstream realtime_gateways {
    least_conn;                      # long-lived sockets: balance by open connections
    server realtime-gateway-1:8081;
    server realtime-gateway-2:8081;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name rt.sarathi.in;
    # ssl_certificate / ssl_certificate_key ...

    location /ws {
        proxy_pass http://realtime_gateways;
        proxy_http_version 1.1;                       # WebSocket needs HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;   # must be > server ping period (54s)
        proxy_send_timeout 75s;
        proxy_buffering off;

        access_log /var/log/nginx/ws.log combined if=$loggable; # tickets are one-time, but keep query strings out of shared logs
    }

    location /healthz { proxy_pass http://realtime_gateways; }
}

map $request_uri $loggable { ~^/ws 0; default 1; }
