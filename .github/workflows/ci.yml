# NOTE: authored but never executed (no GitHub runner available during authoring).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sarathi, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: sarathi_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sarathi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SARATHI_TEST_DATABASE_URL: postgres://sarathi:ci-only@localhost:5432/sarathi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: cd backend && test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 ./...
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/requirements-dev.txt }
      - run: pip install -r ai/requirements-dev.txt
      - run: cd ai && ruff check . && ruff format --check . && pytest -q
  passenger_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cd apps/passenger_app && flutter create --org in.sarathi --project-name sarathi_passenger . && flutter pub get && flutter analyze && flutter test
