# The same checks were run locally in Docker while authoring; this workflow itself has
# not yet run on a GitHub runner.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sarathi, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: sarathi_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sarathi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SARATHI_TEST_DATABASE_URL: postgres://sarathi:ci-only@localhost:5432/sarathi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: cd backend && test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 ./...
      - run: cd backend && go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build && npm test
      - run: cd web && npm audit --omit=dev --audit-level=high

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/requirements-dev.txt }
      - run: pip install -r ai/requirements-dev.txt
      - run: cd ai && ruff check . && ruff format --check . && pytest -q

  passenger_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cd apps/passenger_app && flutter create --org in.sarathi --project-name sarathi_passenger . && flutter pub get && flutter analyze && flutter test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate Kubernetes overlays
        run: |
          for overlay in local production; do
            kubectl kustomize infra/k8s/overlays/$overlay > /tmp/$overlay.yaml
            docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary -kubernetes-version 1.31.0 - < /tmp/$overlay.yaml
          done

  # Builds every image and drives the real stack: sign-in, booking, WebSocket,
  # simulated trip to completion, quota ledger, MongoDB timeline.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start stack
        run: |
          sed -e "s/^SARATHI_JWT_SECRET=.*/SARATHI_JWT_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^SARATHI_GATEWAY_TOKEN=.*/SARATHI_GATEWAY_TOKEN=$(openssl rand -hex 32)/" .env.example > .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          export SARATHI_GATEWAY_TOKEN=$(grep ^SARATHI_GATEWAY_TOKEN= .env | cut -d= -f2)
          API_BASE=http://127.0.0.1:8080 node scripts/smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
